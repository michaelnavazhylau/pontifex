[project]
name = "pontifex"
version = "0.1.0"
description = "Pontifex: a verified Python -> SSA IR -> Lean 4 bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pillow>=11.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/pontifex"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
addopts = "-q"
markers = ["slow: integration tests that invoke lake/lean"]
