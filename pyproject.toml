[project]
name = "pyverif"
version = "0.1.0"
description = "Python -> SSA IR -> Lean 4 verification pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/pyverif"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
addopts = "-q"
markers = ["slow: integration tests that invoke lake/lean"]
