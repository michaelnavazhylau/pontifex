name = "pontifex"
version = "0.1.0"
defaultTargets = ["Pontifex", "pontifex"]

# Core-Lean-only build (no Mathlib, no Physlib). Integer-coefficient Rat
# identities use the kernel-checked rat_ring tactic; see docs/TRUST.md.
[[lean_lib]]
name = "Pontifex"

# Explicit finite native test target, deliberately excluded from defaultTargets
# and from the Pontifex library's import closure / kernel certificate replay.
[[lean_lib]]
name = "PontifexNativeTests"
roots = ["NativeTests"]

[[lean_exe]]
name = "pontifex"
root = "Main"
