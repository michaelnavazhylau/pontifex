name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & kernel check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install Lean, build, and axiom-audit
        uses: leanprover/lean-action@v1.6.2
        with:
          # Build the default targets (Pontifex library, generated examples,
          # Audit.lean, and the pontifex conformance runner).
          auto-config: false
          build: true
          use-mathlib-cache: false
          # Replay every module through the kernel after building.
          leanchecker: true

      - name: Report toolchain
        run: lake env lean --version
