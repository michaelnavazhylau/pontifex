name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format & generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check python scripts

      - name: Check generated Lean artifacts are fresh
        run: uv run python scripts/generate.py --check

      - name: Check rejection diagnostics are fresh
        run: uv run python scripts/update_rejections.py --check

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install Lean and build the conformance runner
        uses: leanprover/lean-action@v1.6.2
        with:
          auto-config: false
          build: true
          use-mathlib-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run the full test suite
        run: uv run pytest -ra
